[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasyleaguefootball"
version = "0.0.1"
description = "Draft-day board for Yahoo half-PPR fantasy football"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SysAdminDoc", email = "matt_parker@outlook.com" }]
keywords = ["fantasy-football", "draft", "yahoo", "nfl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.8.2", "playwright>=1.60"]

[project.scripts]
fantasyleague = "fantasyleague.cli:main"

[project.urls]
Repository = "https://github.com/SysAdminDoc/FantasyLeagueFootball"

[tool.hatch.build.targets.wheel]
# assets/ and data/ live inside the package, so they come along automatically.
packages = ["src/fantasyleague"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
